# Default: PostGIS + API with the in-process job worker (no Redis).
#   docker compose up -d
# Optional Celery/Redis workers:   docker compose --profile celery up -d   (set JOB_BACKEND=celery)
# Optional MinIO object storage:   docker compose --profile minio up -d    (set STORAGE_BACKEND=minio)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: eo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eo}
      POSTGRES_DB: eo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eo"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    image: eo-backend:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://eo:${POSTGRES_PASSWORD:-eo}@db:5432/eo
      DATA_ROOT: /data
    ports: ["8000:8000"]
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
      - ${HOST_MODELS_DIR:-./models}:/models:ro
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [celery]
    restart: unless-stopped

  worker:
    image: eo-backend:latest
    profiles: [celery]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://eo:${POSTGRES_PASSWORD:-eo}@db:5432/eo
      JOB_BACKEND: celery
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app worker --concurrency=2 --loglevel=INFO
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
      - ${HOST_MODELS_DIR:-./models}:/models:ro
    depends_on: [db, redis]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: [minio]
    command: server /export --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-eoadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-eoadmin123}
    volumes: [minio:/export]
    ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
  minio:
